route:
  receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: 410055425
        # chat_id: ${TELEGRAM_CHAT_ID} # get error
        message: |
          🚨 *{{ .CommonLabels.alertname }}*

          *Summary:* {{ .CommonAnnotations.summary }}
          *Details:* {{ .CommonAnnotations.description }}

          *Severity:* {{ .CommonLabels.severity }}
        parse_mode: Markdown
